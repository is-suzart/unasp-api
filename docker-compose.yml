services:
  unasp-api-db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=postgres
      - POSTGRES_DB=unasp
    ports:
      - "5432:5432"
    volumes:
      - unasp-api-db-data:/var/lib/postgresql/data
      - ./containers/database/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - unasp-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d unasp"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  unasp-api-db-data:

networks:
  unasp-network:
    driver: bridge
